    <script>
      // Optional ?port=NNNN query param overrides window.__HARMONIA_PORT__
      // before the wasm module loads (same as ../ui/index.html).
      (function () {
        var port = new URLSearchParams(window.location.search).get("port");
        if (port) {
          window.__HARMONIA_PORT__ = Number(port);
        }
      })();

    <script>
      // KB-1511: unread badge hook. The wasm app calls window.__harmoniaBadge(n) with the true
      // unread total whenever it changes (app.rs, effect next to dm_unread_counts). Only this
      // index defines it, so the main webclient is unaffected.
      (function () {
        var BASE_ICON = "/harmonia-webclient/pwa/icons/favicon-32.png";
        var baseImg = null;
        var drawn = -1;

        function drawFavicon(n) {
          var link = document.getElementById("harmonia-favicon");
          if (!link) return;
          if (n <= 0) {
            link.href = BASE_ICON;
            drawn = 0;
            return;
          }
          if (!baseImg) {
            baseImg = new Image();
            baseImg.onload = function () {
              drawn = -1;
              drawFavicon(window.__harmoniaBadgeLast || 0);
            };
            baseImg.src = BASE_ICON;
            return;
          }
          if (!baseImg.complete || drawn === n) return;
          var c = document.createElement("canvas");
          c.width = 64;
          c.height = 64;
          var ctx = c.getContext("2d");
          if (!ctx) return;
          ctx.drawImage(baseImg, 0, 0, 64, 64);
          var label = n > 99 ? "99+" : String(n);
          ctx.fillStyle = "#e5484d";
          ctx.beginPath();
          ctx.arc(44, 20, 20, 0, 2 * Math.PI);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold " + (label.length > 2 ? 18 : 26) + "px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(label, 44, 21);
          link.href = c.toDataURL("image/png");
          drawn = n;
        }

        window.__harmoniaBadge = function (n) {
          n = Math.max(0, Math.floor(Number(n) || 0));
          if (window.__harmoniaBadgeLast === n) return;
          // Test-visible state first, so a failing OS badge call can never hide it.
          window.__harmoniaBadgeLast = n;
          document.title = n > 0 ? "(" + n + ") Harmonia" : "Harmonia";
          try {
            if (navigator.setAppBadge) {
              var p = n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge();
              if (p && p.catch) p.catch(function () {});
            }

            drawFavicon(n);
          } catch (e) {}

            .register("/harmonia-webclient/pwa/sw.js", {
              scope: "/harmonia-webclient/pwa/",
              updateViaCache: "none",

            .catch(function () {});

        // Small dismissible corner button, only in the installed (standalone) app, only while
        // the permission is undecided. Stores at most a non-personal "dismissed" flag.
        var DISMISS_KEY = "harmonia.pwa.notifyPromptDismissed";

          } catch (e) {}

          } catch (e) {
            return false;

        // ("Badge & notifications"), so they cannot drift. Resolves to the permission string.
        window.__harmoniaEnableNotifications = function () {

            return Promise.resolve(Notification.requestPermission()).then(function (perm) {

              var last = window.__harmoniaBadgeLast || 0;
              window.__harmoniaBadgeLast = undefined;
              if (window.__harmoniaBadge) window.__harmoniaBadge(last);
              // KB-1513: the wasm listens and (re)registers the push subscription.
              if (window.__harmoniaPushPermissionChanged) window.__harmoniaPushPermissionChanged(perm);
              return perm;
            }).catch(function () {
              return "error";
            });
          } catch (e) {
            return Promise.resolve("error");
          }
        };
        function showNotifyPrompt() {
          if (!("Notification" in window) || Notification.permission !== "default") return;
          if (!standalone() || dismissed()) return;
          var box = document.createElement("div");
          box.id = "harmonia-pwa-notify";
          box.style.cssText =
            "position:fixed;right:8px;bottom:8px;z-index:2147483647;display:flex;gap:6px;" +
            "align-items:center;background:#1b1e27;color:#e6e8ee;border:1px solid #3a3f4d;" +
            "border-radius:8px;padding:6px 8px;font:13px sans-serif;";
          var yes = document.createElement("button");
          yes.textContent = "Enable badge";
          var no = document.createElement("button");
          no.textContent = "×";
          no.setAttribute("aria-label", "Dismiss");
          [yes, no].forEach(function (b) {
            b.style.cssText =
              "background:#2b3040;color:#e6e8ee;border:0;border-radius:6px;padding:4px 8px;font:inherit;";
          });
          yes.onclick = function () {
            box.remove();
            window.__harmoniaEnableNotifications();
          };
          no.onclick = function () {
            box.remove();
            try {
              localStorage.setItem(DISMISS_KEY, "1");
            } catch (e) {}
          };
          box.appendChild(yes);
          box.appendChild(no);
          document.body.appendChild(box);

          document.addEventListener("DOMContentLoaded", showNotifyPrompt);
        } else {
          showNotifyPrompt();
        }
      })();

    <script>
      // KB-1513: Web Push hooks (PWA index only; the main index has none, so the wasm's
      // push_register.rs is a no-op there). Nothing here prompts: permission comes only from the
      // opt-in box above (a user tap). The subscription lives in the browser's PushManager only,
      // never in localStorage; the wasm POSTs it to the gateway (self-scoped route).
      // Visible state: #harmonia-push-state[data-push-state] (also mirrored on <html>) is one of
      // subscribed / denied / unsupported / off.
      (function () {
        var READY_TIMEOUT_MS = 10000;
        var LABEL = {
          subscribed: "Notifications: on",
          denied: "Notifications: blocked",
          unsupported: "Notifications: not supported",
          off: "Notifications: off",
        };

        function setPushState(state) {
          try {
            document.documentElement.setAttribute("data-push-state", state);
          } catch (e) {}

                "font:11px sans-serif;color:#9aa0ad;opacity:0.8;";
              document.body.appendChild(el);

        // registration that failed: `ready` would never settle, so it is raced with a timeout.

            new Promise(function (res) {

          var a = new Uint8Array(buf);
          if (a.length !== key.length) return false;
          for (var i = 0; i < a.length; i++) if (a[i] !== key[i]) return false;
          return true;
        }

        function currentSub() {
          return getPushManager().then(function (pm) {
            return pm ? pm.getSubscription() : null;
          });

        // Recomputes data-push-state from permission + current subscription. Never subscribes.
        function refreshPushState() {
          if (!supported()) {
            setPushState("unsupported");
            return Promise.resolve();
          }
          if (Notification.permission === "denied") {
            setPushState("denied");
            return Promise.resolve();
          }
          if (Notification.permission !== "granted") {
            setPushState("off");
            return Promise.resolve();
          }
          return currentSub().then(
            function (sub) {
              setPushState(sub ? "subscribed" : "off");
            },
            function () {
              setPushState("off");
            }
          );
        }

        // -> Promise<string|null>: JSON.stringify(PushSubscription.toJSON()), or null when
        // permission is not granted, push is unsupported, the key is malformed, or subscribe fails.
        window.__harmoniaPushSubscribe = function (vapidKeyB64url) {
          if (!supported() || Notification.permission !== "granted") {
            return refreshPushState().then(function () {
              return null;
            });
          }
          var key = b64urlToBytes(vapidKeyB64url);
          if (!key || key.length !== 65 || key[0] !== 4) return Promise.resolve(null);
          return getPushManager()
            .then(function (pm) {
              if (!pm) {
                setPushState("unsupported");
                return null;
              }
              return pm
                .getSubscription()
                .then(function (sub) {
                  // subscribe() rejects InvalidStateError on a different applicationServerKey.
                  if (sub && !sameKey(sub.options && sub.options.applicationServerKey, key)) {
                    return sub.unsubscribe().then(function () {
                      return null;
                    });
                  }
                  return sub;
                })
                .then(function (sub) {
                  return sub || pm.subscribe({ userVisibleOnly: true, applicationServerKey: key });
                })
                .then(function (sub) {
                  if (!sub) return null;
                  setPushState("subscribed");
                  return JSON.stringify(sub.toJSON());
                });
            })
            .catch(function () {
              return refreshPushState().then(function () {
                return null;
              });
            });
        };

        // -> Promise<string|null>: the endpoint that was unsubscribed (for logout / user switch).
        window.__harmoniaPushUnsubscribe = function () {
          if (!supported()) return Promise.resolve(null);
          return currentSub()
            .then(function (sub) {
              if (!sub) return null;
              var endpoint = sub.endpoint;
              return sub.unsubscribe().then(function () {
                return endpoint;
              });
            })
            .catch(function () {

            })
            .then(function (endpoint) {
              return refreshPushState().then(function () {
                return endpoint;
              });
            });
        };

        // -> Promise<string|null>: the current subscription's endpoint (for badge reports).
        window.__harmoniaPushEndpoint = function () {
          if (!supported()) return Promise.resolve(null);
          return currentSub()
            .then(function (sub) {
              return sub ? sub.endpoint : null;
            })
            .catch(function () {
              return null;
            });
        };

        // Called by the opt-in box after Notification.requestPermission() settles.
        window.__harmoniaPushPermissionChanged = function (perm) {
          refreshPushState();
          if (perm === "granted") {
            try {
              window.dispatchEvent(new Event("harmonia-push-ready"));
            } catch (e) {}
          }
        };

        document.addEventListener("visibilitychange", function () {

          var last = window.__harmoniaBadgeLast;
          if (typeof last !== "number" || !window.__harmoniaBadge) return;
          window.__harmoniaBadgeLast = undefined;
          window.__harmoniaBadge(last);
        });

          document.addEventListener("DOMContentLoaded", refreshPushState);
        } else {
          refreshPushState();
        }
      })();
