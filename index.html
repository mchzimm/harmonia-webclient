    <script>
      // Optional ?port=NNNN query param overrides window.__HARMONIA_PORT__
      // before the wasm module loads, so the same UI build can point at
      // different harmonia-server instances (see webclient-x2, and
      // src/api.rs's api_port() which reads this global, falling back to
      // 4173 when absent -- unchanged behavior for every other caller).
      (function () {
        var port = new URLSearchParams(window.location.search).get("port");
        if (port) {
          window.__HARMONIA_PORT__ = Number(port);
        }
      })();
    </script>
  <link rel="modulepreload" href="/harmonia-webclient/harmonia-ui-d07330a288533a0c.js" crossorigin="anonymous" integrity="sha384-HSv76xO9bAYl4EIInjlllYBOt48vXtnj8VQJF+LqXmecd3/x5GG/FafLF0AcOwsi"><link rel="preload" href="/harmonia-webclient/harmonia-ui-d07330a288533a0c_bg.wasm" crossorigin="anonymous" integrity="sha384-7qkU11Jg4zgjnx4VLDaKUEJbYZvbt2o2WOgXPhRSbdXDVz/vXUkgG8kpix38zE+6" as="fetch" type="application/wasm"></head>
  <body>
<script type="module">
import init, * as bindings from '/harmonia-webclient/harmonia-ui-d07330a288533a0c.js';

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
