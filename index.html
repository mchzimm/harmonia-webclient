<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <script>
      // Optional ?port=NNNN query param overrides window.__HARMONIA_PORT__
      // before the wasm module loads, so the same UI build can point at
      // different harmonia-server instances (see webclient-x2, and
      // src/api.rs's api_port() which reads this global, falling back to
      // 4173 when absent -- unchanged behavior for every other caller).
      (function () {
        var port = new URLSearchParams(window.location.search).get("port");
        if (port) {
          window.__HARMONIA_PORT__ = Number(port);
        }
      })();
    </script>
  <link rel="modulepreload" href="/harmonia-webclient/harmonia-ui-3bd2142cdfdb5dd8.js" crossorigin="anonymous" integrity="sha384-aQLF+6QhvokWInKFJYuKKDacV0Zc/g8qUJhHsleASjHibxBsQmtLADlkxEqpHAVY"><link rel="preload" href="/harmonia-webclient/harmonia-ui-3bd2142cdfdb5dd8_bg.wasm" crossorigin="anonymous" integrity="sha384-PBAnTVfbNkSafXGBmshks7idpcJ5kXB0IQ3GX6DoiyUQnJaPSzSVKmhttJu7PN4c" as="fetch" type="application/wasm"></head>
  <body>
<script type="module">
import init, * as bindings from '/harmonia-webclient/harmonia-ui-3bd2142cdfdb5dd8.js';
const wasm = await init({ module_or_path: '/harmonia-webclient/harmonia-ui-3bd2142cdfdb5dd8_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
