    <script>
      // Optional ?port=NNNN query param overrides window.__HARMONIA_PORT__
      // before the wasm module loads, so the same UI build can point at
      // different harmonia-server instances (see webclient-x2, and
      // src/api.rs's api_port() which reads this global, falling back to
      // 4173 when absent -- unchanged behavior for every other caller).
      (function () {
        var port = new URLSearchParams(window.location.search).get("port");
        if (port) {
          window.__HARMONIA_PORT__ = Number(port);
        }
      })();
    </script>
  <link rel="modulepreload" href="/harmonia-webclient/harmonia-ui-8c3d702c944fd46e.js" crossorigin="anonymous" integrity="sha384-Tz7wxQmqdMVDWYeW7B9tPMOpY/yRnr0ry7SfFHBsT9Wzd8kgS1Cy7eOzRo7QyIPx"><link rel="preload" href="/harmonia-webclient/harmonia-ui-8c3d702c944fd46e_bg.wasm" crossorigin="anonymous" integrity="sha384-Nar1D5qR6CAY4kerZ2xLbCyvSppNuQpy3vPVCBVJYOwSiI9n/mlDWMncTOPWrKfz" as="fetch" type="application/wasm"></head>
  <body>
<script type="module">
import init, * as bindings from '/harmonia-webclient/harmonia-ui-8c3d702c944fd46e.js';

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
