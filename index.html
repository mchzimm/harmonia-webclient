    <!-- KB-295: brand header image, copied verbatim into the bundle by
         trunk's asset-copy directive; referenced by the header component
         via `/harmonia-header-1.jpg` at runtime. -->
    
    <script>
      // Optional ?port=NNNN query param overrides window.__HARMONIA_PORT__
      // before the wasm module loads, so the same UI build can point at
      // different harmonia-server instances (see webclient-x2, and
      // src/api.rs's api_port() which reads this global, falling back to
      // 4173 when absent -- unchanged behavior for every other caller).
      (function () {
        var port = new URLSearchParams(window.location.search).get("port");
        if (port) {
          window.__HARMONIA_PORT__ = Number(port);
        }
      })();
    </script>

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
