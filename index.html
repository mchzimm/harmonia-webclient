<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <script>
      // Optional ?port=NNNN query param overrides window.__HARMONIA_PORT__
      // before the wasm module loads, so the same UI build can point at
      // different harmonia-server instances (see webclient-x2, and
      // src/api.rs's api_port() which reads this global, falling back to
      // 4173 when absent -- unchanged behavior for every other caller).
      (function () {
        var port = new URLSearchParams(window.location.search).get("port");
        if (port) {
          window.__HARMONIA_PORT__ = Number(port);
        }
      })();
    </script>
  <link rel="modulepreload" href="/harmonia-webclient/harmonia-ui-a660c10e5485af10.js" crossorigin="anonymous" integrity="sha384-u/6lEn5rxbA/wSzUCTmf3z4YJDSQAv1R8mYfcQrs3cShV7K5Y2VgsbZh69oiZduH"><link rel="preload" href="/harmonia-webclient/harmonia-ui-a660c10e5485af10_bg.wasm" crossorigin="anonymous" integrity="sha384-Pr6tOo0eDkO/ak/7wLPhgQJuay8WIT1hLTIJDXhPxfDOjYFwy1bA5bDjBMxCq9eL" as="fetch" type="application/wasm"></head>
  <body>
<script type="module">
import init, * as bindings from '/harmonia-webclient/harmonia-ui-a660c10e5485af10.js';
const wasm = await init({ module_or_path: '/harmonia-webclient/harmonia-ui-a660c10e5485af10_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
