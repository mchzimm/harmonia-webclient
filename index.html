<!DOCTYPE html>

    <!-- KB-295: brand header image, copied verbatim into the bundle by
         trunk's asset-copy directive; referenced by the header component
         via `/harmonia-header-1.jpg` at runtime. -->
    
    <script>
      // Optional ?port=NNNN query param overrides window.__HARMONIA_PORT__
      // before the wasm module loads, so the same UI build can point at
      // different harmonia-server instances (see webclient-x2, and
      // src/api.rs's api_port() which reads this global, falling back to
      // 4173 when absent -- unchanged behavior for every other caller).
      (function () {
        var port = new URLSearchParams(window.location.search).get("port");
        if (port) {
          window.__HARMONIA_PORT__ = Number(port);
        }
      })();
    </script>
  <link rel="modulepreload" href="/harmonia-webclient/harmonia-ui-dd978c29a9d71ab0.js" crossorigin="anonymous" integrity="sha384-wmWE5hdhUd0sjQ2HXj/4+M1JAkN13aYKE8IoGGUOJDuysvUzl6P2snIE0a4CmdQg"><link rel="preload" href="/harmonia-webclient/harmonia-ui-dd978c29a9d71ab0_bg.wasm" crossorigin="anonymous" integrity="sha384-fvAU6tV4hw8fpDyA1wBJ/Cct/qzRskzh49hJyRY4lb2Agx5OYD0PfD4dKIBhZHOM" as="fetch" type="application/wasm"></head>
  <body>
<script type="module">
import init, * as bindings from '/harmonia-webclient/harmonia-ui-dd978c29a9d71ab0.js';
const wasm = await init({ module_or_path: '/harmonia-webclient/harmonia-ui-dd978c29a9d71ab0_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
