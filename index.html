<!DOCTYPE html>

    <script>
      // Optional ?port=NNNN query param overrides window.__HARMONIA_PORT__
      // before the wasm module loads, so the same UI build can point at
      // different harmonia-server instances (see webclient-x2, and
      // src/api.rs's api_port() which reads this global, falling back to
      // 4173 when absent -- unchanged behavior for every other caller).
      (function () {
        var port = new URLSearchParams(window.location.search).get("port");
        if (port) {
          window.__HARMONIA_PORT__ = Number(port);
        }
      })();
    </script>
  <link rel="modulepreload" href="/harmonia-webclient/harmonia-ui-901cf41a6dd73a2e.js" crossorigin="anonymous" integrity="sha384-8sXtCHWMIEAeGxTCoxWIaOP8dNk7/mfvebDrIK0B1HXNVyDCpjBK/NoBJdx7dbQ9"><link rel="preload" href="/harmonia-webclient/harmonia-ui-901cf41a6dd73a2e_bg.wasm" crossorigin="anonymous" integrity="sha384-X+1Po0Jpe57TrDiDhh8AITS4XrER8MgzZRfhoOL4mnPSSM4TSAr90aRItSryqMAT" as="fetch" type="application/wasm"></head>
  <body>
<script type="module">
import init, * as bindings from '/harmonia-webclient/harmonia-ui-901cf41a6dd73a2e.js';

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
